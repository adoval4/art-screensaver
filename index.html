<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Screensaver</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }

    .art-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 2.5s ease-in-out;
      z-index: 1;
    }
    .art-layer.active {
      opacity: 1;
      z-index: 2;
    }

    /* Info overlay -- appears on any key/click, fades after 8s */
    #info-overlay {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      padding: 3rem 2.5rem 2rem;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }
    #info-overlay.visible {
      opacity: 1;
    }

    /* Loading screen */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .loading-dot {
      animation: pulse 1.5s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading">
    <div class="text-center">
      <div class="flex gap-2 justify-center mb-4">
        <div class="loading-dot w-2 h-2 bg-white/60 rounded-full" style="animation-delay: 0s"></div>
        <div class="loading-dot w-2 h-2 bg-white/60 rounded-full" style="animation-delay: 0.3s"></div>
        <div class="loading-dot w-2 h-2 bg-white/60 rounded-full" style="animation-delay: 0.6s"></div>
      </div>
      <p class="text-white/40 text-sm tracking-widest uppercase font-light">Loading artwork</p>
    </div>
  </div>

  <!-- Two image layers for crossfade -->
  <img id="layer-a" class="art-layer" alt="">
  <img id="layer-b" class="art-layer" alt="">

  <!-- Info overlay -->
  <div id="info-overlay">
    <p id="info-title" class="text-white text-2xl font-light tracking-wide"></p>
    <p id="info-artist" class="text-white/70 text-lg font-light mt-1"></p>
    <p id="info-date" class="text-white/50 text-sm font-light mt-1"></p>
  </div>

  <script>
    // ── Config ──────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const INTERVAL_MIN  = parseInt(params.get('interval') || '20', 10);
    const INTERVAL_MS   = INTERVAL_MIN * 60 * 1000;
    const SCREEN_W      = window.screen.width  || 1920;
    const SCREEN_H      = window.screen.height || 1080;
    const IIIF_W        = Math.max(SCREEN_W, 1920);
    const API_BASE      = 'https://api.artic.edu/api/v1';
    const IIIF_BASE     = 'https://www.artic.edu/iiif/2';
    const BATCH_SIZE    = 100;
    const MIN_RATIO     = 0.75;  // reject extreme portraits
    const INFO_TIMEOUT  = 8000;

    // Curated search terms that return quality paintings
    const SEARCH_TERMS = [
      'impressionist oil painting',
      'post impressionist painting',
      'landscape oil canvas',
      'monet',
      'van gogh',
      'cezanne',
      'kandinsky',
      'mondrian',
      'sargent',
      'renoir',
      'seurat',
      'degas',
      'matisse painting',
      'abstract painting',
      'modern oil canvas',
      'still life painting oil',
      'expressionist painting',
    ];

    // ── State ───────────────────────────────────────────────
    let currentLayer = 'a';
    let currentArtwork = null;
    let infoTimer = null;

    // ── No-repeat: localStorage keyed by date ───────────────
    function getTodayKey() {
      return 'art-seen-' + new Date().toISOString().slice(0, 10);
    }

    function getSeenIds() {
      try {
        return new Set(JSON.parse(localStorage.getItem(getTodayKey()) || '[]'));
      } catch { return new Set(); }
    }

    function markSeen(id) {
      const seen = getSeenIds();
      seen.add(id);
      localStorage.setItem(getTodayKey(), JSON.stringify([...seen]));
      // Clean old days
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('art-seen-') && key !== getTodayKey()) {
          localStorage.removeItem(key);
        }
      }
    }

    // ── Fetch a single random artwork from AIC ───────────────
    async function fetchOne() {
      const seen = getSeenIds();
      // Pick a random search term and random page (1-10, safe range for search)
      const term = SEARCH_TERMS[Math.floor(Math.random() * SEARCH_TERMS.length)];
      const page = Math.floor(Math.random() * 10) + 1;

      try {
        const q = encodeURIComponent(term);
        const res = await fetch(
          `${API_BASE}/artworks/search?q=${q}&page=${page}&limit=${BATCH_SIZE}&fields=id,title,artist_title,date_display,image_id,is_public_domain,artwork_type_title,thumbnail`
        );
        const data = await res.json();
        const works = (data.data || []).filter(w => {
          if (!w.image_id || !w.is_public_domain || seen.has(w.id)) return false;
          // Only paintings
          if (w.artwork_type_title !== 'Painting') return false;
          // Aspect ratio filter -- reject extreme portraits
          const t = w.thumbnail || {};
          const tw = t.width || 0;
          const th = t.height || 1;
          if (th && tw / th < MIN_RATIO) return false;
          return true;
        });
        if (works.length === 0) return null;
        return works[Math.floor(Math.random() * works.length)];
      } catch (err) {
        console.error('API fetch error:', err);
        return null;
      }
    }

    // ── Build IIIF URL ──────────────────────────────────────
    function imageUrl(imageId) {
      return `${IIIF_BASE}/${imageId}/full/${IIIF_W},/0/default.jpg`;
    }

    // ── Preload an image ────────────────────────────────────
    function preloadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(url);
        img.onerror = () => reject(new Error('Failed to load: ' + url));
        img.src = url;
      });
    }

    // ── Get next artwork (each call = fresh random page) ─────
    async function getNextArtwork() {
      while (true) {
        const work = await fetchOne();
        if (work) return work;
        // API miss or all seen -- wait and retry with new random page
        await new Promise(r => setTimeout(r, 2000));
      }
    }

    // ── Show artwork with crossfade ─────────────────────────
    async function showArtwork(artwork) {
      const url = imageUrl(artwork.image_id);

      try {
        await preloadImage(url);
      } catch {
        // Skip broken images
        return false;
      }

      const nextLayer = currentLayer === 'a' ? 'b' : 'a';
      const nextEl = document.getElementById(`layer-${nextLayer}`);
      const prevEl = document.getElementById(`layer-${currentLayer}`);

      nextEl.src = url;
      nextEl.alt = artwork.title || '';

      // Crossfade
      nextEl.classList.add('active');
      prevEl.classList.remove('active');

      currentLayer = nextLayer;
      currentArtwork = artwork;
      markSeen(artwork.id);

      // Hide loading on first image
      const loading = document.getElementById('loading');
      if (!loading.classList.contains('hidden')) {
        loading.classList.add('hidden');
      }

      return true;
    }

    // ── Info overlay ────────────────────────────────────────
    function showInfo() {
      if (!currentArtwork) return;
      const overlay = document.getElementById('info-overlay');
      document.getElementById('info-title').textContent = currentArtwork.title || 'Untitled';
      document.getElementById('info-artist').textContent = currentArtwork.artist_title || 'Unknown artist';
      document.getElementById('info-date').textContent = currentArtwork.date_display || '';

      overlay.classList.add('visible');
      clearTimeout(infoTimer);
      infoTimer = setTimeout(() => overlay.classList.remove('visible'), INFO_TIMEOUT);
    }

    // ── Double-press detection (Fire TV compatible) ──────────
    // Fire TV remote center button = keyCode 13 (Enter) or 23 (DPAD_CENTER)
    // May NOT fire 'click' events in WebView -- only keydown.
    // D-pad arrows: left=37, up=38, right=39, down=40
    let cycleTimer = null;
    let lastTapTime = 0;
    let singleTapTimer = null;
    let nextArtworkReady = null; // preloaded next artwork

    function handleTap(e) {
      const now = Date.now();
      if (now - lastTapTime < 600) {
        // Double press -- skip to next
        clearTimeout(singleTapTimer);
        lastTapTime = 0;
        skipToNext();
      } else {
        // First press -- wait to see if second comes
        lastTapTime = now;
        singleTapTimer = setTimeout(() => {
          showInfo();
          lastTapTime = 0;
        }, 600);
      }
    }

    // Keydown: filter to select/enter keys for double-tap, show info on others
    document.addEventListener('keydown', (e) => {
      const key = e.keyCode || e.which;
      // Enter (13), DPAD_CENTER (23), Space (32)
      if (key === 13 || key === 23 || key === 32) {
        e.preventDefault();
        handleTap(e);
      }
      // Right arrow = skip to next immediately
      else if (key === 39) {
        e.preventDefault();
        skipToNext();
      }
      // Any other key = show info
      else {
        showInfo();
      }
    });

    document.addEventListener('click', handleTap);
    document.addEventListener('touchstart', handleTap);
    document.addEventListener('dblclick', (e) => e.preventDefault());

    // ── Preload next artwork in background ──────────────────
    async function preloadNext() {
      while (true) {
        const artwork = await getNextArtwork();
        const url = imageUrl(artwork.image_id);
        try {
          await preloadImage(url);
          nextArtworkReady = artwork;
          return;
        } catch {
          // Image failed to load, try another
          continue;
        }
      }
    }

    async function skipToNext() {
      if (cycleTimer) { clearTimeout(cycleTimer); cycleTimer = null; }
      // Use preloaded artwork if available, otherwise fetch fresh
      let artwork = nextArtworkReady;
      nextArtworkReady = null;
      if (artwork) {
        await showArtwork(artwork);
      } else {
        while (true) {
          artwork = await getNextArtwork();
          const ok = await showArtwork(artwork);
          if (ok) break;
        }
      }
      // Start preloading next immediately
      preloadNext();
      scheduleCycle();
    }

    // ── Main loop ───────────────────────────────────────────
    function scheduleCycle() {
      if (cycleTimer) clearTimeout(cycleTimer);
      cycleTimer = setTimeout(async () => {
        await skipToNext();
      }, INTERVAL_MS);
    }

    async function run() {
      // Show first artwork
      while (true) {
        const artwork = await getNextArtwork();
        const ok = await showArtwork(artwork);
        if (ok) break;
      }
      // Preload next immediately
      preloadNext();
      // Start cycle
      scheduleCycle();
    }

    // ── Prevent screen sleep (Wake Lock API) ────────────────
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch { /* not supported or denied */ }
    }

    // ── Go fullscreen on first interaction ──────────────────
    function goFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      requestWakeLock();
      // Remove listener after first trigger
      document.removeEventListener('click', goFullscreen);
      document.removeEventListener('keydown', goFullscreen);
    }
    document.addEventListener('click', goFullscreen);
    document.addEventListener('keydown', goFullscreen);

    // ── Start ───────────────────────────────────────────────
    requestWakeLock();
    run();
  </script>
</body>
</html>
